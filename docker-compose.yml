services:
  app:
    image: node:20-alpine
    working_dir: /app
    profiles:
      - app
    depends_on:
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/greenquote?schema=public
      JWT_SECRET: dev-only-jwt-secret-not-for-any-non-local-environment
      NODE_ENV: development
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "npm ci && npm run dev -- -H 0.0.0.0"

  migrator:
    image: node:20-alpine
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/greenquote?schema=public
    command: sh -c "npm ci && npx prisma migrate deploy && npm run prisma:seed"
    volumes:
      - .:/app

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: greenquote
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d greenquote"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
